name: Claude revisa el pull request

# La red de contención del trabajo automático: todo pull request que se abre
# —incluidos los que abre Claude de noche— recibe una revisión antes de que tú
# lo mires. Los hallazgos quedan como comentarios en las líneas del diff.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  revisar:
    # En un repositorio público GitHub no le pasa los secretos a los pull
    # requests que vienen de un fork, así que ahí no hay nada que correr.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Los pull requests del turno de noche los abre el bot de Actions.
          # Sin esta línea, justo esos se quedarían sin revisar.
          allowed_bots: 'github-actions[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Escribe la revisión en castellano, con el tono llano del repositorio."
