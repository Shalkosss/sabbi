# Lo que tiene que estar verde antes de mirar un PR.
#
# Hasta ahora el unico check del repo era el de Vercel, que comprueba que la
# app compile. Compilar no es lo mismo que estar bien: los 562 tests fijan el
# caso Ana Tumi al centavo y el motor entero, y nadie los estaba corriendo mas
# que a mano. Un PR que rompa el golden test llegaba a la revision con el tilde
# verde de Vercel puesto.
#
# No corre `next build`: eso ya lo hace Vercel en cada PR, y ademas publica un
# preview navegable. Repetirlo aca seria pagar dos veces por la misma respuesta.
#
# Tampoco corre `npm run lint`. El script existe pero apunta a un eslint que el
# repo no declara como dependencia y que no tiene archivo de configuracion: hoy
# falla en cualquier checkout limpio. Ponerlo aca seria un rojo permanente que
# entrena a todos a ignorar el CI.

name: Verificar

on:
  pull_request:
  push:
    branches: [master]

# Un push nuevo sobre la misma rama cancela la corrida anterior: lo que importa
# es si el ultimo commit esta bien, no el que ya quedo atras.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La misma que pide `engines` en el package.json de la raiz.
          node-version: '20'
          cache: npm

      # `ci` y no `install`: instala exactamente lo que dice el lockfile y falla
      # si el lockfile y el package.json no coinciden, que es justo lo que un
      # CI tiene que detectar.
      - name: Instalar
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Corre aunque el typecheck haya fallado. Las dos respuestas son utiles y
      # tenerlas juntas ahorra una vuelta entera de arreglar-empujar-esperar.
      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
